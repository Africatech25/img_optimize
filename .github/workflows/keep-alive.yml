name: Keep Render API Alive

on:
  schedule:
    # Ping toutes les 5 minutes (limite minimale de GitHub)
    - cron: '*/5 * * * *'

  # Permet de déclencher manuellement depuis l'interface GitHub
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping API Health Endpoint
        run: |
          echo "Pinging API at $(date)"

          API_URL="${{ secrets.RENDER_API_URL }}/api/health"

          http_code="$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 60 "$API_URL")"
          curl_ec=$?

          # Timeout / erreur réseau (curl exit code 28, etc.) : on log mais on ne fait pas échouer le workflow
          if [ $curl_ec -ne 0 ]; then
            echo "⚠️  Ping impossible (exit code curl: $curl_ec). Probable cold start/timeout. On ne fait PAS échouer le job."
            exit 0
          fi

          if [ "$http_code" -eq 200 ]; then
            echo "✅ API is alive! Status: $http_code"
          else
            echo "⚠️  API returned status: $http_code"
            exit 1
          fi

      - name: Log Ping Result
        if: always()
        run: |
          echo "Ping completed at $(date)"
          echo "Next ping in 5 minutes"
