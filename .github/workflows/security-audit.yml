name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  backend-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit
    
    - name: Audit backend dependencies
      run: |
        cd backend
        pip-audit -r requirements.txt --format json --output backend-audit.json || true
        pip-audit -r requirements.txt --format markdown
      continue-on-error: true
    
    - name: Upload backend audit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-security-audit
        path: backend/backend-audit.json
        retention-days: 90
    
    - name: Bandit SAST scan
      run: |
        pip install bandit
        cd backend
        bandit -r . -ll -f json -o bandit-sast.json || true
        bandit -r . -ll
      continue-on-error: true
    
    - name: Upload Bandit SAST report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-sast-report
        path: backend/bandit-sast.json
        retention-days: 90

  frontend-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Audit frontend dependencies
      run: |
        cd frontend
        npm audit --json > npm-audit.json || true
        npm audit
      continue-on-error: true
    
    - name: Upload npm audit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-security-audit
        path: frontend/npm-audit.json
        retention-days: 90

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high
        comment-summary-in-pr: true

  codeql-analysis:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      matrix:
        language: [ 'python', 'javascript' ]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: +security-and-quality
    
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
