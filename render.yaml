services:
  # Service Backend API (optimisation d'images)
  - type: web
    name: img-optimize-api
    env: python
    region: frankfurt
    plan: free
    buildCommand: "apt-get update && apt-get install -y ffmpeg && pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        generateValue: true
      - key: CORS_ORIGINS
        value: https://img-optimize-flame.vercel.app
      - key: MAX_DOWNLOAD_SIZE_MB
        value: 500
      - key: DOWNLOAD_ALLOWED_DOMAINS
        value: youtube.com,youtu.be,tiktok.com,facebook.com,fb.watch,instagram.com,vimeo.com,twitter.com,x.com,twitch.tv

  # Service PDF Repair (réparation/analyse de PDF)
  - type: web
    name: img-optimize-pdf-service
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r pdf-repair-service/requirements.txt"
    startCommand: "cd pdf-repair-service && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        generateValue: true
