[pytest]
# Configuration pytest pour img_optimize backend

# Répertoires à scanner pour les tests
testpaths = tests

# Pattern de découverte des tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options par défaut
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=json:coverage.json
    --cov-fail-under=80
    -p no:warnings

# Markers personnalisés
markers =
    slow: tests lents (déselectionner avec -m 'not slow')
    integration: tests d'intégration
    security: tests de sécurité
    unit: tests unitaires
    edge_case: tests de cas limites

# Mode asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Timeouts
timeout = 300
timeout_method = thread

# Ignore certains warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
